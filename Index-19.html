<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GhostTalk - Chat Application</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8a5cf6">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GhostTalk">
    <style>
        :root {
            --bg: #0e0e18;
            --surface: #191927;
            --surface-alt: #242438;
            --accent: #8a5cf6;
            --accent-dark: #6d3fd1;
            --accent-glow: #c2b3ff;
            --spectral: #4ee6c8;
            --spectral-dark: #33c7ab;
            --text: #f1eefc;
            --text-muted: #a9a3c9;
            --sent-bubble: #5b3fae;
            --received-bubble: #26263c;
            --danger: #ff5c72;
            --danger-dark: #e0435b;
            --border: #33334d;
        }
        html, body {
            height: 100%;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: var(--surface);
            overflow: hidden;
            position: relative;
            min-height: 100vh;
        }
        @media (min-width: 490px) {
            .container {
                margin: 30px auto;
                min-height: calc(100vh - 60px);
                border-radius: 14px;
                box-shadow: 0 0 30px rgba(138, 92, 246, 0.25);
            }
        }
        .screen {
            padding: 20px;
            display: none;
        }
        .active {
            display: block;
        }
        h2 {
            text-align: center;
            color: var(--accent-glow);
            margin-bottom: 5px;
        }
        .app-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid var(--border);
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input {
            background: var(--surface-alt);
            color: var(--text);
        }
        input::placeholder {
            color: var(--text-muted);
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: var(--accent-dark);
        }
        .chat-list-item {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-list-item:hover {
            background-color: var(--surface-alt);
        }
        .chat-name {
            flex: 1;
            color: var(--text);
            user-select: none;
            -webkit-user-select: none;
        }
        .chat-avatar {
            width: 44px;
            height: 44px;
            min-width: 44px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-right: 12px;
        }
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        .chat-username {
            font-weight: bold;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-preview {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .unread-badge {
            background: var(--spectral);
            color: #0e0e18;
            border-radius: 12px;
            min-width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            padding: 0 6px;
            margin-left: 8px;
            flex-shrink: 0;
        }
        .chat-list-item.pressed {
            background-color: rgba(138, 92, 246, 0.25);
        }
        .danger-btn {
            background-color: var(--danger);
        }
        .danger-btn:hover {
            background-color: var(--danger-dark);
        }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 90px;
            transform: translateX(-50%);
            background: var(--surface-alt);
            color: var(--text);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 85%;
            text-align: center;
            box-shadow: 0 0 15px rgba(138, 92, 246, 0.35);
            border: 1px solid var(--accent);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, bottom 0.25s ease;
        }
        .toast.show {
            opacity: 1;
            bottom: 100px;
        }
        .toast.error {
            background: var(--danger);
            border-color: var(--danger-dark);
            color: white;
        }
        #chat-screen.active {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            padding: 0;
        }
        @media (min-width: 490px) {
            #chat-screen.active {
                height: 100%;
            }
        }
        #chat-screen.active .chat-header {
            margin: 0;
            border-radius: 0;
            flex-shrink: 0;
        }
        #chat-window {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            padding: 10px;
            gap: 10px;
        }
        #messages-container {
            flex: 1;
            min-height: 0;
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 10px;
            overflow-y: auto;
            background-color: var(--bg);
        }
        #chat-input-row {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        .message {
            margin: 8px 0;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 70%;
            word-break: break-word;
            color: var(--text);
        }
        .sent {
            background-color: var(--sent-bubble);
            margin-left: auto;
            text-align: right;
        }
        .received {
            background-color: var(--received-bubble);
            margin-right: auto;
            text-align: left;
        }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, var(--accent-dark), var(--accent));
            color: white;
            padding: 10px 15px;
            border-radius: 5px 5px 0 0;
            margin: -20px -20px 15px -20px;
        }
        .back-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
            width: auto;
            margin: 0;
            padding: 0;
        }
        .error-msg {
            color: var(--danger);
            text-align: center;
            font-size: 14px;
        }
        .fab-btn {
            position: fixed;
            bottom: 76px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--spectral);
            color: #0e0e18;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(78, 230, 200, 0.55);
            margin: 0;
            padding: 0;
            cursor: pointer;
            border: none;
            line-height: 1;
            z-index: 50;
        }
        .fab-btn:hover {
            background-color: var(--spectral-dark);
        }
        @media (min-width: 490px) {
            .fab-btn {
                right: calc(50vw - 205px);
            }
        }

        /* --- Bottom navigation (Chats / Calls) --- */
        #bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 56px;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: var(--surface);
            border-top: 1px solid var(--border);
            z-index: 60;
        }
        @media (min-width: 490px) {
            #bottom-nav {
                left: 50%;
                width: 450px;
                transform: translateX(-50%);
            }
        }
        .nav-btn {
            flex: 1;
            height: 56px;
            margin: 0;
            padding: 0;
            border: none;
            background: transparent;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font-size: 11px;
            font-weight: normal;
            cursor: pointer;
        }
        .nav-btn .nav-icon {
            font-size: 20px;
        }
        .nav-btn.active {
            color: var(--accent-glow);
        }
        .nav-btn:hover {
            background: var(--surface-alt);
        }

        /* --- Call log rows (Calls tab) --- */
        .call-log-item {
            padding: 10px 4px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .call-log-item:hover {
            background-color: var(--surface-alt);
        }
        .call-log-info {
            flex: 1;
            min-width: 0;
        }
        .call-log-name {
            font-weight: bold;
            color: var(--text);
        }
        .call-log-name.missed {
            color: var(--danger);
        }
        .call-log-detail {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .call-log-time {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            margin-left: 8px;
        }
        .call-log-type-icon {
            font-size: 18px;
            margin-left: 10px;
            color: var(--text-muted);
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.65);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: var(--surface);
            width: 85%;
            max-width: 350px;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid var(--accent);
            box-shadow: 0 0 25px rgba(138, 92, 246, 0.35);
        }
        .modal-box h3 {
            margin: 0 0 15px 0;
            color: var(--accent-glow);
            text-align: center;
        }
        .modal-close {
            background: var(--surface-alt);
            color: var(--text);
            margin-top: 8px;
        }
        .modal-close:hover {
            background: #33334d;
        }

        /* --- Call header buttons --- */
        .header-call-btns {
            display: flex;
            gap: 6px;
        }
        .icon-btn {
            width: auto;
            padding: 6px 10px;
            margin: 0;
            background: rgba(255,255,255,0.15);
            font-size: 18px;
            line-height: 1;
        }
        .icon-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* --- Call overlay screen --- */
        .call-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: #0a0a12;
            z-index: 300;
            flex-direction: column;
            align-items: center;
            color: var(--text);
        }
        .call-overlay.active {
            display: flex;
        }
        #call-topbar {
            padding-top: calc(30px + env(safe-area-inset-top, 0px));
            text-align: center;
        }
        #call-peer-name {
            font-size: 22px;
            font-weight: bold;
            color: var(--accent-glow);
        }
        #call-status-text {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        #call-video-area {
            position: relative;
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #remote-video {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #local-video {
            display: none;
            position: absolute;
            width: 110px;
            height: 150px;
            bottom: 12px;
            right: 12px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid var(--accent);
            background: #000;
        }
        #call-avatar-large {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
        }
        #call-timer {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 10px;
            display: none;
        }
        #incoming-call-buttons {
            display: none;
            gap: 50px;
            padding-bottom: calc(50px + env(safe-area-inset-bottom, 0px));
        }
        #incoming-call-buttons button {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            font-size: 26px;
            margin: 0;
        }
        #decline-btn {
            background: var(--danger);
        }
        #accept-btn {
            background: #2ecc71;
        }
        #active-call-buttons {
            display: none;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 0 20px calc(40px + env(safe-area-inset-bottom, 0px)) 20px;
        }
        .call-ctrl-btn {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: var(--surface-alt);
            font-size: 22px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .call-ctrl-btn span {
            font-size: 10px;
            font-weight: normal;
            color: var(--text-muted);
        }
        .call-ctrl-btn.active-toggle {
            background: var(--accent);
        }
        .call-ctrl-btn.end {
            background: var(--danger);
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. Login / Sign Up Screen -->
    <div id="auth-screen" class="screen active">
        <h2>GhostTalk</h2>
        <div class="app-subtitle">Secure & Simple Messaging</div>
        <div id="auth-error" class="error-msg"></div>
        <input type="text" id="username-input" placeholder="Enter Username">
        <input type="password" id="password-input" placeholder="Enter Password">
        <button onclick="handleAuth('login')">Login</button>
        <button onclick="handleAuth('signup')" style="background-color: #4ee6c8; color: #0e0e18;">Create Account</button>
    </div>

    <!-- 2. Home / Chat List Screen -->
    <div id="home-screen" class="screen" style="padding-bottom: 90px;">
        <div class="chat-header">
            <span id="logged-user-display"></span>
            <button class="back-btn" onclick="logout()">Logout</button>
        </div>
        <h2>GhostTalk Chats</h2>
        <input type="text" id="chat-search-input" placeholder="Search your chats..." oninput="filterChatList()">
        <div id="chats-list" style="max-height: 350px; overflow-y: auto;">
            <!-- Existing chats will appear here -->
        </div>

        <!-- Floating "+" button, opens the New Chat popup -->
        <button class="fab-btn" onclick="openNewChatModal()">+</button>
    </div>

    <!-- 2b. Calls Tab Screen (call log only — who/when, no duration) -->
    <div id="calls-screen" class="screen" style="padding-bottom: 90px;">
        <div class="chat-header">
            <span id="logged-user-display-calls"></span>
            <button class="back-btn" onclick="logout()">Logout</button>
        </div>
        <h2>Calls</h2>
        <div id="calls-list" style="max-height: 450px; overflow-y: auto;">
            <!-- Call log entries appear here -->
        </div>
    </div>

    <!-- Bottom navigation: Chats / Calls -->
    <div id="bottom-nav">
        <button id="nav-chats-btn" class="nav-btn active" onclick="showChatsTab()">
            <span class="nav-icon">💬</span><span>Chats</span>
        </button>
        <button id="nav-calls-btn" class="nav-btn" onclick="showCallsTab()">
            <span class="nav-icon">📞</span><span>Calls</span>
        </button>
    </div>

    <!-- New Chat Popup (username entry) -->
    <div id="new-chat-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>New Chat</h3>
            <div id="new-chat-error" class="error-msg"></div>
            <input type="text" id="new-chat-username" placeholder="Enter username" onkeypress="if(event.key==='Enter') startChatFromModal()">
            <button onclick="startChatFromModal()">Chat</button>
            <button class="modal-close" onclick="closeNewChatModal()">Cancel</button>
        </div>
    </div>

    <!-- Chat Options Popup (Delete / Block) -->
    <div id="chat-options-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="chat-options-title">Options</h3>
            <button class="danger-btn" onclick="deleteChatConfirm()">Delete Chat</button>
            <button class="danger-btn" onclick="blockUserConfirm()">Block User</button>
            <button class="modal-close" onclick="closeChatOptions()">Cancel</button>
        </div>
    </div>

    <!-- 3. Active Chat Window Screen -->
    <div id="chat-screen" class="screen">
        <div class="chat-header">
            <button class="back-btn" onclick="showHomeScreen()">← Back</button>
            <span id="active-chat-user"></span>
            <span class="header-call-btns">
                <button class="icon-btn" onclick="startCall('audio')" title="Audio call">📞</button>
                <button class="icon-btn" onclick="startCall('video')" title="Video call">🎥</button>
            </span>
        </div>
        <div id="chat-window">
            <div id="messages-container"></div>
            <div id="chat-input-row">
                <button id="attach-btn" onclick="document.getElementById('media-input').click()" style="width:46px; padding:10px 0; margin:0 4px 0 0;" title="Send image">📎</button>
                <input type="file" id="media-input" accept="image/*" style="display:none;" onchange="handleMediaSelected(event)">
                <input type="text" id="message-input" placeholder="Type a message..." style="margin:0; flex:1;" onkeypress="checkEnter(event)">
                <button id="voice-btn" onclick="toggleVoiceRecording()" style="width:46px; padding:10px 0; margin:0 4px;" title="Record voice message">🎤</button>
                <button onclick="sendMessage()" style="width: 70px; margin:0;">Send</button>
            </div>
        </div>
    </div>

    <!-- 4. Call Screen (outgoing / incoming / connected) -->
    <div id="call-screen" class="call-overlay">
        <div id="call-topbar">
            <div id="call-peer-name"></div>
            <div id="call-status-text">Calling...</div>
        </div>

        <div id="call-video-area">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
            <div id="call-avatar-large">👻</div>
        </div>

        <div id="call-timer">00:00</div>

        <div id="incoming-call-buttons">
            <button id="decline-btn" onclick="declineCall()" title="Decline">✖</button>
            <button id="accept-btn" onclick="acceptCall()" title="Accept">📞</button>
        </div>

        <div id="active-call-buttons">
            <button id="speaker-btn" class="call-ctrl-btn" onclick="toggleSpeaker()">🔊<span>Speaker</span></button>
            <button id="camera-btn" class="call-ctrl-btn" onclick="toggleCamera()">🎥<span>Camera</span></button>
            <button id="mute-btn" class="call-ctrl-btn" onclick="toggleMute()">🎙️<span>Mute</span></button>
            <button id="end-call-btn" class="call-ctrl-btn end" onclick="endCall()">📵<span>End</span></button>
        </div>
    </div>

</div>

<div id="toast-container"></div>

<!-- Firebase SDKs (compat / classic scripts so this works even when opened directly as a local file) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBOZzhoesUL4TtyUgTuCwQxN-Vper6BhU8",
      authDomain: "waqas-murghiwala.firebaseapp.com",
      projectId: "waqas-murghiwala",
      storageBucket: "waqas-murghiwala.firebasestorage.app",
      messagingSenderId: "768720781558",
      appId: "1:768720781558:web:2cab07577255576f4eacd7",
      measurementId: "G-7E7KH1KB82"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Thin wrappers so the rest of the code (written for the modular SDK) needs no other changes
    function ref(db, path) { return db.ref(path); }
    async function get(reference) { return await reference.once('value'); }
    async function set(reference, value) { return await reference.set(value); }
    function push(reference, value) { return reference.push(value); }
    function onChildAdded(reference, callback) {
        reference.on('child_added', (snapshot) => callback(snapshot));
    }

    function showToast(message, type) {
        let old = document.getElementById('app-toast');
        if(old) old.remove();

        let toast = document.createElement('div');
        toast.id = 'app-toast';
        toast.className = 'toast' + (type === 'error' ? ' error' : '');
        toast.innerText = message;
        document.getElementById('toast-container').appendChild(toast);

        requestAnimationFrame(() => toast.classList.add('show'));

        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 3200);
    }

    let currentUser = localStorage.getItem("ghosttalk_current_user") || null;
    let activeChatUser = null;
    let currentMessagesRef = null;
    let chatPartners = [];

    // --- Call feature state ---
    let peerConnection = null;
    let localStream = null;
    let remoteStream = null;
    let currentCallId = null;
    let currentCallType = null;   // 'video' or 'audio'
    let currentCallRole = null;   // 'caller' or 'callee'
    let currentCallPeer = null;
    let pendingOffer = null;
    let callInviteListenerRef = null;
    let callStatusListenerRef = null;
    let callerCandidatesListenerRef = null;
    let calleeCandidatesListenerRef = null;
    let callTimerInterval = null;
    let callStartTime = null;
    let noAnswerTimeout = null;
    let callFinished = false;
    let isMuted = false;
    let isCameraOff = false;

    const rtcConfig = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
        ]
    };

    // Ghost feature: wipe message history from every chat whenever the app
    // is (re)started, so messages only persist while the app stays open.
    // Only messages that have already been READ are wiped — a message sent
    // while the recipient is offline is left untouched until they actually
    // open that chat and see it at least once.
    async function wipeMyMessages() {
        try {
            let idxSnap = await get(ref(db, 'chat_index/' + currentUser));
            if(!idxSnap.exists()) return;

            let partners = [];
            idxSnap.forEach((child) => partners.push(child.key));

            for(let partner of partners) {
                let chatId = getChatId(currentUser, partner);

                let flagsSnap;
                try {
                    flagsSnap = await get(ref(db, 'read_flags/' + chatId));
                } catch (err) {
                    continue; // no read flags yet (or blocked) — nothing safe to delete
                }
                if(!flagsSnap.exists()) continue;

                let updates = {};
                flagsSnap.forEach((flagChild) => {
                    updates['chats/' + chatId + '/messages/' + flagChild.key] = null;
                    updates['read_flags/' + chatId + '/' + flagChild.key] = null;
                });

                if(Object.keys(updates).length > 0) {
                    await db.ref().update(updates);

                    // If nothing is left in this chat, clear the stale preview
                    // text so the list shows "Start to chat" again.
                    try {
                        let remainingSnap = await db.ref('chats/' + chatId + '/messages').limitToFirst(1).once('value');
                        if(!remainingSnap.exists()) {
                            await set(ref(db, 'chat_index/' + currentUser + '/' + partner + '/preview'), null);
                            await set(ref(db, 'chat_index/' + partner + '/' + currentUser + '/preview'), null);
                        }
                    } catch (err) {
                        console.error("Could not refresh preview after wipe:", err);
                    }
                }
            }
        } catch (err) {
            console.error("Could not clear previous messages:", err);
        }
    }

    window.handleAuth = async function(type) {
        let username = document.getElementById("username-input").value.trim();
        let password = document.getElementById("password-input").value.trim();
        let errorEl = document.getElementById("auth-error");

        if(!username || !password) {
            errorEl.innerText = "Username and password cannot be empty.";
            return;
        }

        let userRef, snapshot;
        try {
            userRef = ref(db, 'users/' + username);
            snapshot = await get(userRef);
        } catch (err) {
            errorEl.innerText = "Database error: " + err.message + " (Firebase rules may be blocking access)";
            console.error(err);
            return;
        }

        if (type === 'signup') {
            if (snapshot.exists()) {
                errorEl.innerText = "Username already exists. Choose another.";
            } else {
                await set(userRef, { password: password, username: username });
                currentUser = username;
                localStorage.setItem("ghosttalk_current_user", currentUser);
                document.getElementById("logged-user-display").innerText = "Welcome, " + currentUser;
                document.getElementById("logged-user-display-calls").innerText = "Welcome, " + currentUser;
                switchScreen('home-screen');
                attachIncomingCallListener();
                loadChatList();
            }
        } else if (type === 'login') {
            if (!snapshot.exists()) {
                errorEl.innerText = "Username does not exist.";
            } else if (snapshot.val().password !== password) {
                errorEl.innerText = "Incorrect password.";
            } else {
                currentUser = username;
                localStorage.setItem("ghosttalk_current_user", currentUser);
                document.getElementById("logged-user-display").innerText = "Welcome, " + currentUser;
                document.getElementById("logged-user-display-calls").innerText = "Welcome, " + currentUser;
                switchScreen('home-screen');
                attachIncomingCallListener();
                await wipeMyMessages();
                loadChatList();
            }
        }
    }

    async function loadCallLog() {
        let listContainer = document.getElementById('calls-list');
        listContainer.innerHTML = "Loading...";

        let snapshot;
        try {
            snapshot = await Promise.race([
                get(ref(db, 'call_log/' + currentUser)),
                new Promise((_, reject) => setTimeout(() => reject(new Error("Timed out. Check your internet connection.")), 15000))
            ]);
        } catch (err) {
            listContainer.innerHTML = "<div class='error-msg'>" + err.message + "</div>";
            console.error(err);
            return;
        }

        let calls = [];
        if(snapshot.exists()) {
            snapshot.forEach((child) => {
                let v = child.val();
                if(v) calls.push(v);
            });
        }

        calls.sort((a, b) => b.timestamp - a.timestamp);
        renderCallLog(calls);
    }

    function formatCallTime(ts) {
        let d = new Date(ts);
        let now = new Date();
        let sameDay = d.toDateString() === now.toDateString();
        let hh = d.getHours();
        let mm = String(d.getMinutes()).padStart(2, '0');
        let ampm = hh >= 12 ? 'PM' : 'AM';
        hh = hh % 12; if(hh === 0) hh = 12;
        let timeStr = hh + ':' + mm + ' ' + ampm;
        if(sameDay) return timeStr;
        return (d.getMonth() + 1) + '/' + d.getDate() + '/' + String(d.getFullYear()).slice(-2) + ', ' + timeStr;
    }

    function renderCallLog(calls) {
        let listContainer = document.getElementById('calls-list');
        listContainer.innerHTML = "";

        if(calls.length === 0) {
            listContainer.innerHTML = "<div style='text-align:center; color:#888; padding:20px 0;'>No calls yet.</div>";
            return;
        }

        calls.forEach((c) => {
            let missed = (c.direction === 'incoming' && (c.status === 'no-answer' || c.status === 'declined'));
            let dirIcon = c.direction === 'outgoing' ? '↗' : '↙';
            let typeIcon = c.type === 'video' ? '🎥' : '📞';

            let item = document.createElement('div');
            item.className = 'call-log-item';
            item.innerHTML = `
                <div class="chat-avatar">👻</div>
                <div class="call-log-info">
                    <div class="call-log-name${missed ? ' missed' : ''}">${c.peer}</div>
                    <div class="call-log-detail">${dirIcon} ${c.type === 'video' ? 'Video call' : 'Voice call'}</div>
                </div>
                <div class="call-log-time">${formatCallTime(c.timestamp)}</div>
                <div class="call-log-type-icon">${typeIcon}</div>`;
            item.onclick = () => {
                activeChatUser = c.peer;
                startCall(c.type);
            };
            listContainer.appendChild(item);
        });
    }

    function getChatId(user1, user2) {
        return user1 < user2 ? `${user1}_${user2}` : `${user2}_${user1}`;
    }

    function makePreviewText(msgData) {
        if(msgData.type === 'image') return '📷 Photo';
        if(msgData.type === 'audio') return '🎤 Voice message';
        let t = msgData.message || '';
        return t.length > 40 ? t.slice(0, 40) + '…' : t;
    }

    async function sendChatMessage(msgData) {
        let chatId = getChatId(currentUser, activeChatUser);
        let msgRef = ref(db, 'chats/' + chatId + '/messages');
        await push(msgRef, msgData);

        // Lightweight index so the chat list loads instantly without
        // downloading every message (including images/audio) just to
        // find out who you've talked to. Also carries a short preview
        // of the last message, like a normal chat app's chat list.
        try {
            let previewData = { preview: makePreviewText(msgData), updatedAt: msgData.timestamp };
            await set(ref(db, 'chat_index/' + currentUser + '/' + activeChatUser), previewData);
            await set(ref(db, 'chat_index/' + activeChatUser + '/' + currentUser), previewData);

            // Bump the recipient's unread counter for this chat
            await ref(db, 'unread_counts/' + activeChatUser + '/' + currentUser)
                .set(firebase.database.ServerValue.increment(1));
        } catch (err) {
            console.error("Could not update chat index:", err);
        }
    }

    window.sendMessage = function() {
        let input = document.getElementById("message-input");
        let text = input.value.trim();
        if(!text || !activeChatUser) return;

        sendChatMessage({

            type: 'text',
            message: text,
            timestamp: Date.now()
        });

        input.value = "";
        input.focus(); // keep the keyboard open for the next message
    }

    window.handleMediaSelected = function(event) {
        let file = event.target.files[0];
        event.target.value = "";
        if(!file || !activeChatUser) return;

        if(file.size > 3 * 1024 * 1024) {
            showToast("This image is too large. Please choose one under 3MB.", "error");
            return;
        }

        let reader = new FileReader();
        reader.onload = function() {
            sendChatMessage({
                sender: currentUser,
                type: 'image',
                message: reader.result,
                timestamp: Date.now()
            });
        };
        reader.onerror = function() {
            showToast("Couldn't read that image. Please try a different one.", "error");
        };
        reader.readAsDataURL(file);
    }

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    window.toggleVoiceRecording = async function() {
        if(!activeChatUser) return;

        if(!isRecording) {
            try {
                let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);

                mediaRecorder.onstop = function() {
                    let audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    let reader = new FileReader();
                    reader.onload = function() {
                        sendChatMessage({
                            sender: currentUser,
                            type: 'audio',
                            message: reader.result,
                            timestamp: Date.now()
                        });
                    };
                    reader.readAsDataURL(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                let btn = document.getElementById('voice-btn');
                btn.innerText = '⏹️';
                btn.style.backgroundColor = '#d9534f';
            } catch (err) {
                let msg = "Couldn't access the microphone.";
                if(location.protocol !== 'https:' && location.hostname !== 'localhost') {
                    msg = "Voice messages need a secure connection. Please open this app in your browser (not an in-app preview) to use the microphone.";
                } else if(err.name === 'NotAllowedError') {
                    msg = "Microphone permission was denied. Please allow microphone access for this app and try again.";
                } else if(err.name === 'NotFoundError') {
                    msg = "No microphone was found on this device.";
                }
                showToast(msg, "error");
                console.error(err);
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            let btn = document.getElementById('voice-btn');
            btn.innerText = '🎤';
            btn.style.backgroundColor = '';
        }
    }

    function loadMessages() {
        let container = document.getElementById("messages-container");
        container.innerHTML = "";

        // Detach any previously attached listener so messages aren't duplicated
        if(currentMessagesRef) {
            currentMessagesRef.off('child_added');
            currentMessagesRef = null;
        }

        let chatId = getChatId(currentUser, activeChatUser);
        let msgRef = ref(db, 'chats/' + chatId + '/messages');
        currentMessagesRef = msgRef;

        onChildAdded(msgRef, (snapshot) => {
            let data = snapshot.val();
            if(!data) return;

            let msgDiv = document.createElement("div");
            msgDiv.className = "message " + (data.sender === currentUser ? "sent" : "received");

            try {
                if(data.type === 'image') {
                    let img = document.createElement('img');
                    img.src = data.message;
                    img.style.maxWidth = '200px';
                    img.style.borderRadius = '8px';
                    img.style.display = 'block';
                    msgDiv.appendChild(img);
                } else if(data.type === 'audio') {
                    let audio = document.createElement('audio');
                    audio.src = data.message;
                    audio.controls = true;
                    audio.style.maxWidth = '200px';
                    msgDiv.appendChild(audio);
                } else {
                    msgDiv.innerText = data.message;
                }
            } catch (err) {
                console.error("Failed to render message:", err);
                msgDiv.innerText = "[Could not display this message]";
            }

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;

            // Mark as "read" (lightweight flag only) once the recipient has
            // actually seen it. Only messages marked read become eligible
            // for deletion on the next app restart — so messages sent while
            // the other person is offline still wait for them safely.
            if(data.sender !== currentUser) {
                set(ref(db, 'read_flags/' + chatId + '/' + snapshot.key), true)
                    .catch(err => console.error("Could not mark message read:", err));
            }
        });
    }

    function renderChatList(filterText) {
        let listContainer = document.getElementById("chats-list");
        let filtered = chatPartners.filter(p => p.username.toLowerCase().includes((filterText || "").toLowerCase()));

        listContainer.innerHTML = "";

        if(filtered.length === 0) {
            if(chatPartners.length === 0) {
                listContainer.innerHTML = "<div style='text-align:center; color:#888; padding:20px 0;'>No chats yet.<br>Tap + to start a new chat.</div>";
            } else {
                listContainer.innerHTML = "<div style='text-align:center; color:#888; padding:20px 0;'>No matching chats.</div>";
            }
            return;
        }

        filtered.forEach((p) => {
            let item = document.createElement("div");
            item.className = "chat-list-item";

            let previewText = p.preview ? p.preview : "Start to chat";
            let badgeHtml = p.unreadCount > 0
                ? `<span class="unread-badge">${p.unreadCount > 99 ? '99+' : p.unreadCount}</span>`
                : "";

            item.innerHTML = `
                <div class="chat-avatar">👻</div>
                <div class="chat-info">
                    <div class="chat-username">${p.username}</div>
                    <div class="chat-preview">${previewText}</div>
                </div>
                ${badgeHtml}`;
            attachLongPress(item, p.username);
            listContainer.appendChild(item);
        });
    }

    function attachLongPress(item, username) {
        let pressTimer = null;
        let longPressTriggered = false;
        const LONG_PRESS_MS = 550;

        function startPress() {
            longPressTriggered = false;
            item.classList.add('pressed');
            pressTimer = setTimeout(() => {
                longPressTriggered = true;
                item.classList.remove('pressed');
                if(navigator.vibrate) navigator.vibrate(25);
                openChatOptions(username);
            }, LONG_PRESS_MS);
        }

        function cancelPress() {
            clearTimeout(pressTimer);
            item.classList.remove('pressed');
        }

        item.addEventListener('touchstart', startPress, { passive: true });
        item.addEventListener('touchend', cancelPress);
        item.addEventListener('touchmove', cancelPress);
        item.addEventListener('touchcancel', cancelPress);
        item.addEventListener('mousedown', startPress);
        item.addEventListener('mouseup', cancelPress);
        item.addEventListener('mouseleave', cancelPress);
        item.addEventListener('contextmenu', (e) => e.preventDefault());
        item.addEventListener('click', () => {
            if(!longPressTriggered) openChat(username);
        });
    }

    window.filterChatList = function() {

    async function loadChatList() {
        let listContainer = document.getElementById("chats-list");
        listContainer.innerHTML = "Loading...";
        document.getElementById("chat-search-input").value = "";

        let idxSnapshot, unreadSnapshot;
        try {
            let results = await Promise.race([
                Promise.all([
                    get(ref(db, 'chat_index/' + currentUser)),
                    get(ref(db, 'unread_counts/' + currentUser))
                ]),
                new Promise((_, reject) => setTimeout(() => reject(new Error("Timed out. Check your internet connection.")), 15000))
            ]);
            idxSnapshot = results[0];
            unreadSnapshot = results[1];
        } catch (err) {
            listContainer.innerHTML = "<div class='error-msg'>" + err.message + "</div>";
            console.error(err);
            return;
        }

        let unreadCounts = {};
        if(unreadSnapshot.exists()) {
            unreadSnapshot.forEach((childSnapshot) => {
                unreadCounts[childSnapshot.key] = childSnapshot.val() || 0;
            });
        }

        chatPartners = [];

        if(idxSnapshot.exists()) {
            idxSnapshot.forEach((childSnapshot) => {
                let username = childSnapshot.key;
                let data = childSnapshot.val();
                // Older/legacy entries may just be "true" with no preview yet
                let preview = (data && typeof data === 'object') ? data.preview : null;
                let updatedAt = (data && typeof data === 'object') ? data.updatedAt : 0;
                chatPartners.push({
                    username: username,
                    preview: preview,
                    updatedAt: updatedAt || 0,
                    unreadCount: unreadCounts[username] || 0
                });
            });
        }

        chatPartners.sort((a, b) => b.updatedAt - a.updatedAt);

        renderChatList("");
    }

    // ============ CALLING FEATURE (real WebRTC + Firebase signaling) ============

    async function createPeerConnection() {
        let pc = new RTCPeerConnection(rtcConfig);

        pc.ontrack = (event) => {
            if(!remoteStream) remoteStream = new MediaStream();
            event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
            document.getElementById('remote-video').srcObject = remoteStream;
        };

        pc.onicecandidate = (event) => {
            if(event.candidate && currentCallId) {
                let path = currentCallRole === 'caller' ? 'callerCandidates' : 'calleeCandidates';
                push(ref(db, 'calls/' + currentCallId + '/' + path), event.candidate.toJSON())
                    .catch(err => console.error("Could not send ICE candidate:", err));
            }
        };

        return pc;
    }

    async function getLocalMedia(type) {
        let constraints = type === 'video' ? { video: true, audio: true } : { video: false, audio: true };
        return await navigator.mediaDevices.getUserMedia(constraints);
    }

    function onCallConnected() {
        clearTimeout(noAnswerTimeout);
        callStartTime = Date.now();
        document.getElementById('call-status-text').innerText = 'Connected';
        document.getElementById('incoming-call-buttons').style.display = 'none';
        document.getElementById('active-call-buttons').style.display = 'flex';
        document.getElementById('call-timer').style.display = 'block';
        callTimerInterval = setInterval(updateCallTimer, 1000);
    }

    function updateCallTimer() {
        let secs = Math.floor((Date.now() - callStartTime) / 1000);
        let mm = String(Math.floor(secs / 60)).padStart(2, '0');
        let ss = String(secs % 60).padStart(2, '0');
        document.getElementById('call-timer').innerText = mm + ':' + ss;
    }

    function listenForRemoteCandidates(path) {
        let candRef = ref(db, 'calls/' + currentCallId + '/' + path);
        if(path === 'calleeCandidates') calleeCandidatesListenerRef = candRef; else callerCandidatesListenerRef = candRef;
        candRef.on('child_added', async (snap) => {
            let candidate = snap.val();
            if(candidate && peerConnection) {
                try { await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); }
                catch(err) { console.error("Error adding ICE candidate:", err); }
            }
        });
    }

    function attachCallStatusListener(callId) {
        let callRef = ref(db, 'calls/' + callId);
        callStatusListenerRef = callRef;
        callRef.on('value', async (snap) => {
            let data = snap.val();
            if(!data || currentCallId !== callId) return;

            if(currentCallRole === 'caller' && data.status === 'accepted' && data.answer
               && peerConnection && !peerConnection.currentRemoteDescription) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                onCallConnected();
            }

            if(data.status === 'declined') {
                if(currentCallRole === 'caller') showToast(currentCallPeer + " declined the call.", "error");
                finishCall('declined');
            } else if(data.status === 'ended') {
                finishCall(callStartTime ? 'ended' : 'no-answer');
            }
        });
    }

    window.startCall = async function(type) {
        if(!activeChatUser) return;
        if(currentCallId) { showToast("You're already in a call.", "error"); return; }

        callFinished = false;
        currentCallType = type;
        currentCallRole = 'caller';
        currentCallPeer = activeChatUser;
        currentCallId = currentUser + '_' + activeChatUser + '_' + Date.now();

        showCallScreen('calling', type, activeChatUser);

        try {
            localStream = await getLocalMedia(type);
        } catch(err) {
            showToast("Couldn't access camera/microphone: " + (err.message || err.name), "error");
            let idToClean = currentCallId;
            currentCallId = null;
            hideCallScreen();
            return;
        }

        attachLocalStream(type);

        peerConnection = await createPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        let offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        let callData = {
            caller: currentUser,
            callee: activeChatUser,
            type: type,
            offer: { type: offer.type, sdp: offer.sdp },
            status: 'ringing',
            createdAt: Date.now()
        };

        try {
            await set(ref(db, 'calls/' + currentCallId), callData);
            await set(ref(db, 'call_invites/' + activeChatUser + '/' + currentCallId), true);
        } catch(err) {
            showToast("Couldn't start the call: " + err.message, "error");
            finishCall('ended');
            return;
        }

        listenForRemoteCandidates('calleeCandidates');
        attachCallStatusListener(currentCallId);

        noAnswerTimeout = setTimeout(() => {
            if(currentCallId) finishCall('no-answer');
        }, 45000);
    }

    window.acceptCall = async function() {
        if(!currentCallId || currentCallRole !== 'callee') return;

        try {
            localStream = await getLocalMedia(currentCallType);
        } catch(err) {
            showToast("Couldn't access camera/microphone: " + (err.message || err.name), "error");
            declineCall();
            return;
        }

        attachLocalStream(currentCallType);

        peerConnection = await createPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer));
        let answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        try {
            await set(ref(db, 'calls/' + currentCallId + '/answer'), { type: answer.type, sdp: answer.sdp });
            await set(ref(db, 'calls/' + currentCallId + '/status'), 'accepted');
            await removeNode('call_invites/' + currentUser + '/' + currentCallId);
        } catch(err) {
            showToast("Couldn't accept the call: " + err.message, "error");
            return;
        }

        listenForRemoteCandidates('callerCandidates');
        onCallConnected();
    }

    window.declineCall = async function() {
        if(!currentCallId) return;
        try {
            await set(ref(db, 'calls/' + currentCallId + '/status'), 'declined');
            await removeNode('call_invites/' + currentUser + '/' + currentCallId);
        } catch(err) { console.error(err); }
        finishCall('declined');
    }

    window.endCall = async function() {
        if(!currentCallId) return;
        try {
            await set(ref(db, 'calls/' + currentCallId + '/status'), 'ended');
        } catch(err) { console.error(err); }
        finishCall(callStartTime ? 'ended' : 'no-answer');
    }

    function finishCall(reason) {
        if(callFinished) return;
        callFinished = true;

        if(currentCallId && currentCallPeer) {
            let duration = callStartTime ? Math.floor((Date.now() - callStartTime) / 1000) : 0;
            let callerName = currentCallRole === 'caller' ? currentUser : currentCallPeer;
            let calleeName = currentCallRole === 'caller' ? currentCallPeer : currentUser;
            claimAndLogCall(currentCallId, currentCallType, reason, duration, callerName, calleeName);
        }

        cleanupCallState();
        hideCallScreen();
    }

    // Only one side (whoever reaches this first) actually writes the call
    // record, so a single call never produces two log entries.
    async function claimAndLogCall(callId, type, reason, durationSecs, callerName, calleeName) {
        try {
            let result = await db.ref('calls/' + callId + '/logPosted').transaction(current => current ? undefined : true);
            if(!result.committed) return; // the other side already logged this call
        } catch (err) {
            console.error("Could not claim call log:", err);
            return;
        }

        let label;
        if(reason === 'declined') label = 'Declined';
        else if(reason === 'no-answer') label = 'No answer';
        else if(durationSecs > 0) {
            let mm = String(Math.floor(durationSecs / 60)).padStart(2, '0');
            let ss = String(durationSecs % 60).padStart(2, '0');
            label = mm + ':' + ss;
        } else {
            label = 'Call ended';
        }

        let icon = type === 'video' ? '📹 Video call' : '📞 Voice call';
        let logTimestamp = Date.now();
        let msgData = {
            sender: callerName,
            type: 'call',
            message: icon + ' — ' + label,
            timestamp: logTimestamp
        };

        try {
            let chatId = getChatId(callerName, calleeName);
            await push(ref(db, 'chats/' + chatId + '/messages'), msgData);

            let previewData = { preview: icon + ' - ' + label, updatedAt: logTimestamp };
            await set(ref(db, 'chat_index/' + callerName + '/' + calleeName), previewData);
            await set(ref(db, 'chat_index/' + calleeName + '/' + callerName), previewData);
            await ref(db, 'unread_counts/' + calleeName + '/' + callerName).set(firebase.database.ServerValue.increment(1));

            // Lightweight call log entries (no message content/duration text needed
            // beyond what the Calls tab itself displays) — one per participant, each
            // seeing the call from their own point of view (outgoing vs incoming).
            await push(ref(db, 'call_log/' + callerName), { peer: calleeName, type: type, direction: 'outgoing', status: reason, timestamp: logTimestamp });
            await push(ref(db, 'call_log/' + calleeName), { peer: callerName, type: type, direction: 'incoming', status: reason, timestamp: logTimestamp });
        } catch (err) {
            console.error("Could not post call log:", err);
        }
    }

    function cleanupCallState() {
        clearTimeout(noAnswerTimeout);
        clearInterval(callTimerInterval);
        callTimerInterval = null;
        callStartTime = null;

        if(peerConnection) {
            try { peerConnection.close(); } catch(err) {}
            peerConnection = null;
        }
        if(localStream) {
            localStream.getTracks().forEach(t => t.stop());
            localStream = null;
        }
        remoteStream = null;

        if(callStatusListenerRef) { callStatusListenerRef.off('value'); callStatusListenerRef = null; }
        if(callerCandidatesListenerRef) { callerCandidatesListenerRef.off('child_added'); callerCandidatesListenerRef = null; }
        if(calleeCandidatesListenerRef) { calleeCandidatesListenerRef.off('child_added'); calleeCandidatesListenerRef = null; }

        if(currentCallId) {
            let idToClean = currentCallId;
            setTimeout(() => { removeNode('calls/' + idToClean).catch(() => {}); }, 5000);
        }

        currentCallId = null;
        currentCallType = null;
        currentCallRole = null;
        currentCallPeer = null;
        pendingOffer = null;
        isMuted = false;
        isCameraOff = false;
    }

    window.toggleMute = function() {
        if(!localStream) return;
        isMuted = !isMuted;
        localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
        let btn = document.getElementById('mute-btn');
        btn.classList.toggle('active-toggle', isMuted);
        btn.querySelector('span').innerText = isMuted ? 'Unmute' : 'Mute';
    }

    window.toggleCamera = function() {
        if(!localStream || currentCallType !== 'video') return;
        isCameraOff = !isCameraOff;
        localStream.getVideoTracks().forEach(t => t.enabled = !isCameraOff);
        document.getElementById('camera-btn').classList.toggle('active-toggle', isCameraOff);
    }

    window.toggleSpeaker = function() {
        document.getElementById('speaker-btn').classList.toggle('active-toggle');
        showToast("Speaker output follows your device's own volume/output settings.");
    }

    // Global incoming-call listener — active for as long as the user is logged in,
    // regardless of which screen they're currently viewing.
    function attachIncomingCallListener() {
        if(callInviteListenerRef) callInviteListenerRef.off('child_added');
        callInviteListenerRef = ref(db, 'call_invites/' + currentUser);
        callInviteListenerRef.on('child_added', async (snap) => {
            let callId = snap.key;

            if(currentCallId) {
                // Already on a call elsewhere — auto-decline as busy
                try { await set(ref(db, 'calls/' + callId + '/status'), 'declined'); } catch(err) {}
                removeNode('call_invites/' + currentUser + '/' + callId).catch(() => {});
                return;
            }

            let callSnap = await get(ref(db, 'calls/' + callId));
            let callData = callSnap.val();
            if(!callData || callData.status !== 'ringing') {
                removeNode('call_invites/' + currentUser + '/' + callId).catch(() => {});
                return;
            }

            callFinished = false;
            currentCallId = callId;
            currentCallType = callData.type;
            currentCallRole = 'callee';
            currentCallPeer = callData.caller;
            pendingOffer = callData.offer;

            showCallScreen('incoming', callData.type, callData.caller);
            attachCallStatusListener(callId);
        });
    }

    function detachIncomingCallListener() {
        if(callInviteListenerRef) {
            callInviteListenerRef.off('child_added');
            callInviteListenerRef = null;
        }
    }
</script>
<script>
    if('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js').catch(err => console.error('SW registration failed:', err));
        });
    }
</script>
